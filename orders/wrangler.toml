# CalmGastro orders API + admin panel (Cloudflare Worker + D1, free plan)
# Deploy:      npx wrangler deploy
# Migrations:  npx wrangler d1 migrations apply calmgastro-orders --remote
# Secrets (never written here):
#   npx wrangler secret put PASSWORD_PEPPER  (random, 32+ characters; keys every admin password hash and encrypts 2FA secrets)
#   npx wrangler secret put TOKEN_SECRET     (random, 32+ characters; customer secure order links)
#   npx wrangler secret put ADMIN_PASSWORD   (only for the one-time setup page that creates the first Super Admin)
name = "calmgastro-orders"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Admin interface files (public/admin/*), served through the Worker so every response gets the security headers
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[vars]
SITE_URL = "https://vitamik.com/"
ALLOWED_ORIGINS = "https://vitamik.com,https://www.vitamik.com"

[[d1_databases]]
binding = "DB"
database_name = "calmgastro-orders"
database_id = "8e3bb58f-4857-4e1b-b00c-fd5afa906f30"
migrations_dir = "migrations"

# Cloudflare rate limits per IP address
[[ratelimits]]
name = "ORDER_LIMITER"      # creating orders: 10 per minute (some mobile carriers share one IP)
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "LOOKUP_LIMITER"     # order page + tracking: 30 per minute
namespace_id = "2002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LOGIN_LIMITER"      # admin login attempts: 5 per minute
namespace_id = "2003"
simple = { limit = 5, period = 60 }
